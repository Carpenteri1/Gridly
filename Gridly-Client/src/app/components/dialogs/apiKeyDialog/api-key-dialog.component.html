<dialog #dlg appDialogWindow [open]="open" [dialogId]="id" [id]="id" (openChange)="openChange.emit($event)" class="ew-dialog">
  <div class="ew-card">
    <header class="ew-header">
      <h3 id="ew-title" class="m-0">{{TextStringsUtil.DialogApiKeyTitle}}</h3>
      <button type="button" class="btn" aria-label="Close" (click)="close()">
        <i class="bi bi-x-lg"></i>
      </button>
    </header>
    <div class="ew-body">
      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="api-key-input" class="form-label">{{TextStringsUtil.DialogApiKeyInputLabel}}</label>
          <p *ngIf="invalidKey">{{TextStringsUtil.DialogApiKeyInvalidMessage}}</p>
          <p *ngIf="!invalidKey">{{TextStringsUtil.DialogApiKeyDescription}}</p>
          <input
            type="password"
            id="api-key-input"
            class="form-control"
            name="rawKey"
            [(ngModel)]="rawKey"
            autocomplete="off"
            required>
          <p class="text-danger" *ngIf="errorMessage">{{errorMessage}}</p>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4">
          <button type="button" class="btn btn-secondary" (click)="close()">{{TextStringsUtil.DialogApiKeyCancelBtnTitle}}</button>
          <button type="submit" class="btn btn-primary" [disabled]="saving">{{TextStringsUtil.DialogApiKeySaveBtnTitle}}</button>
        </div>
      </form>
    </div>
  </div>
</dialog>
