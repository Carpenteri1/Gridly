<dialog #dlg appDialogWindow [open]="open" class="aw-dialog" aria-labelledby="aw-title">
  <div class="aw-card">
    <header class="aw-header">
      <h5 id="aw-title" class="m-0">{{ TextStringsUtil.AddCardTitle }}</h5>
      <button type="button" class="btn" aria-label="Close" (click)="close()">
        <i class="bi bi-x-lg"></i>
      </button>
    </header>
    @if (selectedWidget(); as widget) {
      <div class="aw-body">
        <p class="text-muted mb-3">{{ widget.label }}</p>
        <div class="mb-3">
          <label for="clock-timezone-select" class="form-label">Timezone</label>
          <select id="clock-timezone-select" class="form-select"
                  [ngModel]="selectedTimeZone()" (ngModelChange)="selectedTimeZone.set($event)">
            @for (tz of timeZoneOptions; track tz) {
              <option [value]="tz">{{ tz }}</option>
            }
          </select>
        </div>
        <div class="mb-3">
          <span class="form-label d-block">Display format</span>
          <div class="btn-group" role="group">
            <button type="button" class="btn btn-outline-secondary"
                    [class.active]="selectedDisplayFormat() === 'digital'"
                    (click)="selectedDisplayFormat.set('digital')">Digital</button>
            <button type="button" class="btn btn-outline-secondary"
                    [class.active]="selectedDisplayFormat() === 'analog'"
                    (click)="selectedDisplayFormat.set('analog')">Analog</button>
          </div>
        </div>
        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-secondary" (click)="cancelClockConfig()">{{ TextStringsUtil.DialogAddCardCancelBtnTitle }}</button>
          <button type="button" class="btn btn-primary" (click)="confirmClock()">{{ TextStringsUtil.DialogAddCardAcceptBtnTitle }}</button>
        </div>
      </div>
    } @else if(widgetOptions$ | async; as options){
      <div class="aw-body">
        <p class="text-muted mb-3">{{ TextStringsUtil.AddCardDescription }}</p>
        <div class="row row-cols-1 row-cols-sm-2 g-3 py-2">
          @for(option of options; track option.widgetType){
            <div class="col">
              <button type="button"
                      class="btn btn-outline-secondary w-100 h-100 d-flex flex-column align-items-center gap-2 p-4 option-btn"
                      (click)="onSelect(option)">
                <mat-icon [class]="'option-icon'">{{option.icon}}</mat-icon>
                <div class="text-center">
                  <div class="fw-semibold">{{ option.label }}</div>
                  <div class="text-muted small">{{ option.description }}</div>
                </div>
              </button>
            </div>
          }
        </div>
      </div>
    }
  </div>
</dialog>
