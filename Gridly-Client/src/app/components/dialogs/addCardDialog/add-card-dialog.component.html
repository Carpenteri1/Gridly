<dialog #dlg appDialogWindow [open]="open" class="aw-dialog" aria-labelledby="aw-title">
  <div class="aw-card">
    <header class="aw-header">
      <h5 id="aw-title" class="m-0">{{ locale.addCardPicker.text.title }}</h5>
      <button type="button" class="btn" aria-label="Close" (click)="close()">
        <i class="bi bi-x-lg"></i>
      </button>
    </header>
    @if(widgetOptions$ | async; as options){
      <div class="aw-body">
        <p class="text-muted mb-3">{{ locale.addCardPicker.text.description }}</p>
        <div class="row row-cols-1 row-cols-sm-2 g-3 py-2">
          @for(option of options; track option.widgetType){
            <div class="col">
              <button type="button"
                      class="btn btn-outline-secondary w-100 h-100 d-flex flex-column align-items-center gap-2 p-4 option-btn"
                      (click)="onSelect(option)">
                <mat-icon [class]="'option-icon'">{{option.icon}}</mat-icon>
                <div class="text-center">
                  <div class="fw-semibold">{{ option.label }}</div>
                  <div class="text-muted small">{{ option.description }}</div>
                </div>
              </button>
            </div>
          }
        </div>
      </div>
    }
  </div>
</dialog>
