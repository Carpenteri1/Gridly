<dialog #dlg appModalWindow [open]="open" [id]="id" class="ew-dialog">
  <div class="ew-card">
    <header class="ew-header">
      <h3 id="ew-title" class="m-0">Edit {{cardId}}</h3>
      <button type="button" class="btn" aria-label="Close" (click)="close()">
        <i class="bi bi-x-lg"></i>
      </button>
    </header>
    <div class="ew-body">
      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="name-input" class="form-label">{{locale.deleteCardDialog.text.title}}</label>
          <p> {{locale.deleteCardDialog.text.description}}</p>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4">
          <button type="button" class="btn btn-secondary" (click)="close()">{{locale.deleteCardDialog.text.cancelBtnTitle}}</button>
          <button type="submit" class="btn btn-primary">{{locale.deleteCardDialog.text.acceptBtnTitle}}</button>
        </div>
      </form>
    </div>
  </div>
</dialog>
