<div class="clock-widget d-flex flex-column align-items-center justify-content-center h-100">
  @if (displayFormat === 'analog') {
    <svg viewBox="0 0 100 100" width="100" height="100" class="clock-face">
      <circle cx="50" cy="50" r="48" class="clock-face-circle" />
      <line x1="50" y1="50" x2="50" y2="25" class="clock-hand clock-hand-hour"
            [attr.transform]="'rotate(' + hourAngle + ' 50 50)'" />
      <line x1="50" y1="50" x2="50" y2="15" class="clock-hand clock-hand-minute"
            [attr.transform]="'rotate(' + minuteAngle + ' 50 50)'" />
      <line x1="50" y1="50" x2="50" y2="10" class="clock-hand clock-hand-second"
            [attr.transform]="'rotate(' + secondAngle + ' 50 50)'" />
      <circle cx="50" cy="50" r="2" class="clock-center-dot" />
    </svg>
  } @else {
    <span class="clock-digital-time">{{ digitalTime }}</span>
  }
  <span class="clock-timezone-label">{{ timeZone }}</span>
</div>
