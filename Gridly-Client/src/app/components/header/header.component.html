<header class="sticky-top bg-body border-bottom backdrop">
  <nav class="navbar navbar-expand-lg container py-2">
    <div class="d-flex align-items-center me-3" animate.enter="enter-animation">
      <div class="logo-box me-2">
        <i class="bi bi-columns text-white fs-5"></i>
      </div>
      <h1 class="h4 fw-bold gradient-text m-0">{{ 'app.text.title' | translate }}</h1>
    </div>

    <div class="navbar-collapse collapse justify-content-end" [class.show]="editActive()" id="mainNavbar" animate.enter="enter-animation">
      <ul class="navbar-nav align-items-lg-center gap-2 ms-lg-3"  >
        @if(editActive()){
          <li class="nav-item">
            <button class="btn btn-outline-primary btn-sm d-flex align-items-center gap-1" (click)="addDialogActive = true">
              <i class="bi bi-plus-lg me-1"></i>
              <span>{{ 'menu.text.addCardButtonTitle' | translate }}</span>
            </button>
          </li>
          <li class="nav-item">
            <button class="btn btn-outline-primary btn-sm d-flex align-items-center gap-1" (click)="openAddProviderKeyDialog()">
              <i class="bi bi-key"></i>
              <span>{{ 'menu.text.addProviderKeysButtonTitle' | translate }}</span>
            </button>
          </li>
           <li class="nav-item">
             <button class="btn btn-primary btn-sm d-flex align-items-center gap-1"
                     (click)="save()">
               <i class="bi bi-save"></i>
               <span>{{ 'menu.text.saveButtonTitle' | translate }}</span>
             </button>
           </li>
        }

        <li class="nav-item">
          <button class="btn btn-sm d-flex align-items-center gap-1"
                  [ngClass]="editActive() ? 'btn-primary' : 'btn-outline-secondary'"
                  (click)="toggleMenu()">
            <i class="bi bi-pencil"></i>
            <span>{{ (editActive() ?
              'menu.text.exitEditButtonTitle' :
              'menu.text.editButtonTitle') | translate }}</span>
          </button>
        </li>

        <li class="nav-item">
          <button class="btn btn-dark btn-sm"><i class="bi bi-brightness-low"></i></button>
        </li>
      </ul>
    </div>
  </nav>
</header>
<app-add-card-dialog
  [open]="addDialogActive"
  (newCard)="add($event)">
</app-add-card-dialog>
<app-provider-key-dialog
  [open]="isAddProviderDialogOpen()"
  (openChange)="handleDialogChange($event)">
</app-provider-key-dialog>
